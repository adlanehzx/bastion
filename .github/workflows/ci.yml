name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (fmt, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge lint
      - run: forge test -vv

  keeper:
    name: Keeper (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: keeper
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Keeper ABI matches the contract
        run: |
          (cd contracts && forge build)
          jq '.abi' contracts/out/Vault.sol/Vault.json | diff - <(jq '.' keeper/abi/Vault.json)
      - run: cargo fmt --check
        working-directory: keeper
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: keeper
      - run: cargo test --locked
        working-directory: keeper

  e2e:
    name: End-to-end (anvil + keeper)
    runs-on: ubuntu-latest
    needs: [contracts, keeper]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: keeper
      - uses: foundry-rs/foundry-toolchain@v1
      - run: ./scripts/e2e.sh
