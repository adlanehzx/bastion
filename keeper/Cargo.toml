[package]
name = "bastion-keeper"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.6.1", features = ["full", "signer-local"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
